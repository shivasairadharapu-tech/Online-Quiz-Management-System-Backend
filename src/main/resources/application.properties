spring.application.name=quiz-backend
server.port=${PORT:8080}

# MySQL Database Configuration (Connecting to local MySQL on port 3306)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/online_quiz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration (Min 256 bits secret for HMAC-SHA256)
app.jwt.secret=QuizMasterSecretKeyForJwtAuthenticationWithMin256BitsLength1234567890
app.jwt.expiration-ms=86400000